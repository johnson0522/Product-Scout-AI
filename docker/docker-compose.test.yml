services:
  product-scout-postgres-test:
    image: postgres:16-alpine
    container_name: product-scout-postgres-test
    environment:
      POSTGRES_USER: product_scout_test
      POSTGRES_PASSWORD: product_scout_test
      POSTGRES_DB: product_scout_test
    ports:
      - "55432:5432"
    volumes:
      - product_scout_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_scout_test -d product_scout_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  product_scout_postgres_test_data: