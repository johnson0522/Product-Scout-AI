version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: product-scout-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: product_scout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d product_scout"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: product-scout-web
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/product_scout
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: product-scout-agent
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/product_scout
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AGENT_RUNTIME_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
